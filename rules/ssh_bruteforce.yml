title: SSH Authentication Failure Burst
id: 1a2b3c4d-0001-4000-8000-000000000001
status: experimental
description: Detects repeated SSH authentication failures from a single source IP within a short window, indicative of brute-force.
author: rogonzo
date: 2026/11/22
tags:
  - attack.credential_access
  - attack.t1110.001
logsource:
  product: linux
  service: sshd
detection:
  selection:
    message|contains: 'Failed password'
  timeframe: 5m
  condition: selection | count() by src_ip > 10
fields:
  - src_ip
  - user
falsepositives:
  - Misconfigured automated jobs using stale credentials
  - Vulnerability scanners in an authorized engagement
level: medium
